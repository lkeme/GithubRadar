# 可覆盖的环境变量见 .env.example

services:
  githubradar:
    build: .
    container_name: githubradar
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    ports:
      # 只绑定宿主回环地址；远程访问请在本机放反向代理，不要把这里改成 0.0.0.0。
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"
    environment:
      NODE_ENV: production
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8080}
      # 必须与浏览器实际访问的 scheme/host/port 完全一致；localhost 与 127.0.0.1 不能互换。
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-5}
      # 受信反向代理地址（逗号分隔 IP/CIDR）；不配置时反代后面的登录限速会全站共用一个桶。
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 唯一数据卷；宿主目录需预先创建且 UID 10001 可写（见 README）。
      - ./data:/data
    tmpfs:
      # 只读根文件系统下唯一可写临时目录。
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "node", "/app/server/dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
